
services:
  app:
    image: node
    working_dir: /app
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: [npm, run, dev]

  mongo:
    image: mongo:7.0.11
    container_name: mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: devel
      MONGO_INITDB_ROOT_PASSWORD: devel
    healthcheck:
      test: [ "CMD","mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 5s

    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  mongo-express:
    image: mongo-express:1.0.2
    container_name: mongo-express
    restart: "no"
    ports:
      - "27080:8081"
    environment:
      ME_CONFIG_BASICAUTH_USERNAME: devel
      ME_CONFIG_BASICAUTH_PASSWORD: devel
      ME_CONFIG_MONGODB_URL: ${MONGO_DSN}
    depends_on:
     - mongo

volumes:
  mongo_data:
  node_modules:
